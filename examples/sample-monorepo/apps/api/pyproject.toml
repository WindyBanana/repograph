[project]
name = "acme-api"
version = "0.4.1"
description = "Order API for the ACME web shop"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "stripe",
  "acme-shared>=1.2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acme-api = "app.main:main"
