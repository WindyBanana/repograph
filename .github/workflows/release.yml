name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for a dry run without a tag)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            platform: linux
          - os: macos-13
            label: macos-x86_64
            platform: darwin
          - os: macos-14
            label: macos-arm64
            platform: darwin
          - os: windows-latest
            label: windows-x86_64
            platform: win32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tool
        run: python -m pip install --upgrade pip pyinstaller==6.*

      - name: Build the executable
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyi packaging/repograph.spec

      - name: Smoke test — the binary must actually scan
        shell: bash
        env:
          REPOGRAPH_FORCE_CLI: "1"
        run: |
          BIN=dist/repograph
          [ "${{ matrix.platform }}" = "win32" ] && BIN=dist/repograph.exe
          "$BIN" --version
          "$BIN" scan examples/sample-monorepo -o smoke-out --quiet --no-git
          python - <<'PY'
          import json, sys
          manifest = json.load(open("smoke-out/MANIFEST.json"))
          expected = {"index.html", "AI-REPORT.md", "BUSINESS-OVERVIEW.md", "repograph.json",
                      "report.pdf", "report.xlsx", "presentation.pptx"}
          missing = expected - set(manifest["files"])
          if missing:
              sys.exit(f"the packaged binary did not produce: {sorted(missing)}")
          if manifest["summary"]["applications"] != 4:
              sys.exit("the packaged binary did not find the sample applications")
          print(f"packaged binary produced {len(manifest['files'])} files")
          PY

      - name: Build the desktop wrapper
        shell: bash
        run: |
          BIN=dist/repograph
          [ "${{ matrix.platform }}" = "win32" ] && BIN=dist/repograph.exe
          python packaging/bundle.py "$BIN" -o dist --platform ${{ matrix.platform }}

      - name: Package (unix)
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          mkdir -p out
          NAME=repograph-${{ matrix.label }}
          cp README.md LICENSE docs/INSTALL.md dist/ 2>/dev/null || true
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            (cd dist && zip -qry "../out/$NAME.zip" repograph repograph.app README.md LICENSE INSTALL.md)
          else
            (cd dist && tar czf "../out/$NAME.tar.gz" repograph repograph.desktop repograph.svg README.md LICENSE INSTALL.md)
          fi
          (cd out && shasum -a 256 * > "$NAME.sha256")

      - name: Package (windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $name = "repograph-${{ matrix.label }}"
          Copy-Item README.md,LICENSE,docs/INSTALL.md dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/repograph.exe,dist/create-shortcut.vbs,dist/README.md,dist/LICENSE,dist/INSTALL.md -DestinationPath "out/$name.zip" -Force
          Get-FileHash "out/$name.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } | Out-File -Encoding ascii "out/$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: repograph-${{ matrix.label }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Standalone builds — no Python installation required.

            | Platform | Download | Run it |
            |---|---|---|
            | Windows | `repograph-windows-x86_64.zip` | double-click `repograph.exe` for the UI, or run it in a terminal for the CLI |
            | macOS (Apple silicon) | `repograph-macos-arm64.zip` | double-click `repograph.app`, or run `./repograph` in a terminal |
            | macOS (Intel) | `repograph-macos-x86_64.zip` | as above |
            | Linux | `repograph-linux-x86_64.tar.gz` | `./repograph` for the CLI, or install the `.desktop` entry for the launcher |

            Verify a download with the matching `.sha256` file.

            macOS will warn that the app is from an unidentified developer — it is
            unsigned. Right-click the app and choose Open, or run
            `xattr -d com.apple.quarantine repograph.app`.
