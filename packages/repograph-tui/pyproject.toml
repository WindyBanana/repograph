[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph-tui"
version = "0.1.1"
description = "Terminal user interface for repograph"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repograph contributors" }]
dependencies = ["repograph-core"]

[tool.setuptools.packages.find]
where = ["src"]
