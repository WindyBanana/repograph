[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph-ui"
version = "0.1.1"
description = "Local desktop UI for repograph"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repograph contributors" }]
dependencies = ["repograph-core", "repograph-render"]

[tool.setuptools.packages.find]
where = ["src"]
