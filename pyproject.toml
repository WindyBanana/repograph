[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph"
version = "0.1.0"
description = "Scan any repository and produce architecture diagrams, process flows, dependency graphs, vulnerability findings and reports — deterministically, without AI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repograph contributors" }]
keywords = ["architecture", "static-analysis", "c4", "archimate", "bpmn", "sbom", "diagrams",
            "dependency-graph", "security", "documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/WindyBanana/repograph"
Issues = "https://github.com/WindyBanana/repograph/issues"

[project.scripts]
repograph = "repograph_cli.main:main"

[tool.setuptools]
package-dir = { "" = "packages/repograph-core/src" }

[tool.setuptools.packages.find]
where = [
  "packages/repograph-core/src",
  "packages/repograph-render/src",
  "packages/repograph-cli/src",
  "packages/repograph-tui/src",
  "packages/repograph-ui/src",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["examples", "build", "dist"]

[tool.ruff.lint.per-file-ignores]
# These modules are mostly long OOXML string templates; breaking them hurts more
# than it helps.
"packages/repograph-render/src/repograph_render/pptx.py" = ["E501"]
"packages/repograph-render/src/repograph_render/xlsx.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP006/UP007/UP045: we still target Python 3.9 at runtime, so typing.Dict and
# Optional[...] stay; E741 and B008 are deliberate in a few places.
ignore = ["E741", "B008", "UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/repograph-core/src",
  "packages/repograph-render/src",
  "packages/repograph-cli/src",
  "packages/repograph-tui/src",
  "packages/repograph-ui/src",
]
